; PlatformIO configuration for motor/sensor test
;
; To use this test:
; 1. Rename this file to platformio.ini (backup the original first)
; 2. Run: pio run -t upload
; 3. Run: pio device monitor
;
; OR use the commands provided in the upload instructions

[env:motor_sensor_test]
platform = espressif32
board = esp32dev
framework = arduino

; TTGO T-Display specific
board_build.partitions = default.csv
board_build.flash_mode = dio

; Serial configuration
monitor_speed = 115200
monitor_filters = direct

; Upload settings
upload_speed = 921600

; Build settings
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Source file
src_filter =
    +<../test_motor_sensors.cpp>

lib_deps =
    SPI
