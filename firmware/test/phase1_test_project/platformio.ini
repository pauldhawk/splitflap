; Phase 1 Motor Test - PlatformIO Configuration

[env:phase1_test]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Upload settings
upload_speed = 921600

; Build settings
build_flags =
    -DCORE_DEBUG_LEVEL=3